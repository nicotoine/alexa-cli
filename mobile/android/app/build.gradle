apply plugin: 'com.android.application'

// The app's version is alexa-cli's (package.json at the repo root). scripts/build-apk.sh passes the build number
// (commits on the branch: it only grows, so each APK installs over the previous one) and the full version name.
def cliVersion = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
def (major, minor, patch) = cliVersion.tokenize('.').collect { it.replaceAll('[^0-9].*', '') as int }
def buildNumber = project.hasProperty('alexaBuild') ? (project.property('alexaBuild') as int) : major * 10000 + minor * 100 + patch
def fullVersionName = project.hasProperty('alexaVersionName') ? project.property('alexaVersionName') : cliVersion

android {
    namespace = "io.github.nicotoine.alexacli"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.nicotoine.alexacli"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNumber
        versionName fullVersionName
        // scripts/build-apk.sh --abi arm64-v8a: one architecture only. Embedded Node.js is ~40 MB per architecture.
        if (project.hasProperty('alexaAbi')) {
            ndk { abiFilters project.property('alexaAbi') }
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Without --abi: one APK per architecture, and a universal one with all three. Same versionCode for all: they
    // are sideloaded, never sent to a store.
    splits {
        abi {
            enable !project.hasProperty('alexaAbi')
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    // Every build is signed with the same key, so each one installs over the previous one. By default the open-source
    // key in this directory (public on purpose: it proves nothing about who built the APK, only that updates fit).
    // A private key given in the environment (ALEXA_CLI_KEYSTORE…, the CI's secrets) takes its place.
    signingConfigs {
        oss {
            storeFile file('oss-signing.keystore')
            storePassword 'alexa-cli-oss'
            keyAlias 'alexa-cli'
            keyPassword 'alexa-cli-oss'
        }
        own {
            if (System.getenv('ALEXA_CLI_KEYSTORE')) {
                storeFile file(System.getenv('ALEXA_CLI_KEYSTORE'))
                storePassword System.getenv('ALEXA_CLI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ALEXA_CLI_KEY_ALIAS')
                keyPassword System.getenv('ALEXA_CLI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig System.getenv('ALEXA_CLI_KEYSTORE') ? signingConfigs.own : signingConfigs.oss
        }
        release {
            signingConfig System.getenv('ALEXA_CLI_KEYSTORE') ? signingConfigs.own : signingConfigs.oss
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
