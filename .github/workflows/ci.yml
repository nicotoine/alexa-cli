# Tests on every push and pull request; the Android app on every tag (v*) and on demand.
#
# The APK is signed with the release key when the repository has these secrets (Settings > Secrets > Actions):
#   ALEXA_CLI_KEYSTORE_BASE64   the keystore file, base64-encoded (base64 -w0 alexa-cli.jks)
#   ALEXA_CLI_KEYSTORE_PASSWORD, ALEXA_CLI_KEY_ALIAS, ALEXA_CLI_KEY_PASSWORD
# Without them it builds a debug APK: it installs, but each build is signed with a throwaway key, so a new one cannot
# be installed over the previous one (uninstall first).

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: The interface builds
        run: npm run ui:build

  apk:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Release key (when configured)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALEXA_CLI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alexa-cli.jks"
            echo "path=$RUNNER_TEMP/alexa-cli.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK (arm64, the architecture of current phones)
        env:
          ALEXA_CLI_KEYSTORE: ${{ steps.key.outputs.path }}
          ALEXA_CLI_KEYSTORE_PASSWORD: ${{ secrets.ALEXA_CLI_KEYSTORE_PASSWORD }}
          ALEXA_CLI_KEY_ALIAS: ${{ secrets.ALEXA_CLI_KEY_ALIAS }}
          ALEXA_CLI_KEY_PASSWORD: ${{ secrets.ALEXA_CLI_KEY_PASSWORD }}
        run: |
          if [ -n "$ALEXA_CLI_KEYSTORE" ]; then
            scripts/build-apk.sh --release --abi arm64-v8a
          else
            scripts/build-apk.sh --abi arm64-v8a
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alexa-cli-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
