# Tests on every push and pull request; on every push to main, the Android app and a GitHub release.
#
# Versions
#   - <major>.<minor> come from package.json ("npm version minor" starts a new series); the patch is the build
#     number, the count of commits on main. It only grows, so each APK installs over the previous one.
#   - Every push to main makes a release v<major>.<minor>.<build> with a universal APK and one per architecture,
#     under fixed names, so .../releases/latest/download/alexa-cli-universal.apk is always the newest.
#
# Signing: the open-source key committed in mobile/android/app (public on purpose: updates install over each other).
# With these repository secrets (Settings > Secrets > Actions) a private key is used instead — switching keys means
# uninstalling once.
#   ALEXA_CLI_KEYSTORE_BASE64   the keystore, base64-encoded (base64 -w0 alexa-cli.jks)
#   ALEXA_CLI_KEYSTORE_PASSWORD, ALEXA_CLI_KEY_ALIAS, ALEXA_CLI_KEY_PASSWORD

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: The interface builds
        run: npm run ui:build

  apk:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time: two pushes in a row must not race. A newer push replaces a build still running.
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        id: version
        run: |
          series=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          build=$(git rev-list --count HEAD)
          commit=$(git rev-parse --short HEAD)
          echo "version=$series.$build" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "### alexa-cli $series.$build ($commit)" >> "$GITHUB_STEP_SUMMARY"

      - name: Private key (when configured)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALEXA_CLI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alexa-cli.jks"
            echo "path=$RUNNER_TEMP/alexa-cli.jks" >> "$GITHUB_OUTPUT"
          else
            echo "Signed with the open-source key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the APKs (universal, arm64-v8a, armeabi-v7a, x86_64)
        env:
          ALEXA_CLI_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          ALEXA_CLI_COMMIT: ${{ steps.version.outputs.commit }}
          ALEXA_CLI_KEYSTORE: ${{ steps.key.outputs.path }}
          ALEXA_CLI_KEYSTORE_PASSWORD: ${{ secrets.ALEXA_CLI_KEYSTORE_PASSWORD }}
          ALEXA_CLI_KEY_ALIAS: ${{ secrets.ALEXA_CLI_KEY_ALIAS }}
          ALEXA_CLI_KEY_PASSWORD: ${{ secrets.ALEXA_CLI_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/build-apk.sh
          # Fixed names in the release: the "latest" download links never change.
          mkdir -p release
          for variant in universal arm64-v8a armeabi-v7a x86_64; do
            cp "dist/alexa-cli-$VERSION-$variant.apk" "release/alexa-cli-$variant.apk"
          done
          (cd release && sha256sum *.apk > SHA256SUMS)
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: alexa-cli-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Release v${{ steps.version.outputs.version }}
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: alexa-cli ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            Construite automatiquement depuis `main`, commit ${{ steps.version.outputs.commit }}.

            **Quel APK ?** `alexa-cli-universal.apk` s'installe sur tous les téléphones. Les autres sont plus légers,
            un par processeur : `arm64-v8a` (la plupart des téléphones récents), `armeabi-v7a` (téléphones 32 bits,
            anciens ou d'entrée de gamme), `x86_64` (émulateurs, quelques tablettes).

            Chaque version s'installe par-dessus la précédente.
          files: |
            release/*.apk
            release/SHA256SUMS

      # The rolling "latest" pre-release of the earlier pipeline: replaced by the releases above.
      - name: Remove the old "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true
